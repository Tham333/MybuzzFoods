name: MYBUZZ Food Bot

on:
  workflow_dispatch:

jobs:
  food-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile mybuzz_food_bot.py

      - name: Run MYBUZZ Food Bot
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python mybuzz_food_bot.py

      - name: Save bot state
        if: always()
        run: |
          git config user.name "MYBUZZ Food Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted.json bot_state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update MYBUZZ Food Bot data"
            git push
          fi
